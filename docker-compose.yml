# Local development services. Production uses Neon (Postgres).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: intelliprompt
      POSTGRES_PASSWORD: intelliprompt
      POSTGRES_DB: intelliprompt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
